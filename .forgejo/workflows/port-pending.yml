name: Port Pending

# This file exists to shadow .github/workflows, not to do work.
#
# Forgejo falls back to .github/workflows when .forgejo/workflows is absent,
# so before this directory existed every push to the forge ran scratch's
# GitHub workflows -- which `docker login ghcr.io` with a secret that does not
# exist here, `docker build` against a daemon that does not exist here, and
# `docker manifest push` to a registry we are leaving. Runs 77 and 78 are the
# two failures that proves it. Keeping one file here keeps those dormant.
#
# Replaced by the real port (srv/ui build via buildx driver=remote into zot).
on:
  push:
    branches: [main]

jobs:
  noop:
    name: Port pending
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "scratch's CI has not been ported to the forge yet."
          echo "The GitHub workflows under .github/workflows cannot run here."
